name: 'Deploy Lambda Layer'
description: 'Deploys Lambda layers using a custom script'
author: 'Mohamed Navfar'

inputs:
  ARTIFACT_BUCKET:
    description: 'Artifact bucket name'
    required: true
  ARTIFACT_PATH:
    description: 'Artifact Path'
    required: true
  LAMBDA_CONFIG_FILE:
    description: 'Path to Lambda config file'
    required: true

runs:
  using: 'docker'
  image: "Dockerfile"

branding:
  icon: "layers"
  color: "gray-dark"